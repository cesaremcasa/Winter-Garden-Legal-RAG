name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run mypy api config llm parsers retrieval scripts validators
      - run: uv run pytest -q
      - run: uv run pip-audit
      - run: >-
          uv run detect-secrets scan --all-files
          --exclude-files '(^|/)(\.venv|data/index|\.mypy_cache|\.pytest_cache|\.ruff_cache)(/|$)'
          --exclude-files '\.(png|jpg|jpeg|gif)$'
          --exclude-files 'uv\.lock$'
