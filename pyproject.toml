[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winter-garden-legal-rag"
version = "0.1.0"
description = "Local-first legal document retrieval with grounded citations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cesar Augusto" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pypdf>=5,<7",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "types-PyYAML>=6,<7",
]

[tool.setuptools]
packages = ["api", "config", "llm", "parsers", "retrieval", "utils", "validators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data/index"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
